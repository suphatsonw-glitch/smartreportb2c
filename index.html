<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14432b">
<title>ศูนย์รายงาน · สาขาบริษัท</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --deep: #14432b; --g: #1a7a3c; --gl: #e8f5ee; --gm: #b8dfc8; --bg: #eef3ef; --ink: #17261c; --muted: #4b6b55; --red: #b3261e; --r: 14px; --safe-b: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 Sarabun, 'Noto Sans Thai', sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; }
.top { position: sticky; top: 0; z-index: 5; background: var(--deep); color: #fff; padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top)); display: flex; gap: 10px; align-items: center; }
.top .t { flex: 1; } .top b { display: block; font-size: 18px; } .top small { opacity: .8; }
.top button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
.top a.home { color: #fff; text-decoration: none; font-size: 20px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 14px 12px calc(30px + var(--safe-b)); }
.card { background: #fff; border-radius: var(--r); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
.card h2 { font-size: 17px; margin: 0 0 10px; color: var(--deep); }
label.f { display: block; font-size: 13px; color: var(--muted); font-weight: 700; margin: 8px 0 4px; }
input[type=date], input[type=text], input[type=password], select { width: 100%; min-height: 46px; border: 1.5px solid #cfe0d4; border-radius: 12px; padding: 8px 12px; background: #fff; color: var(--ink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { border: 1.5px solid #cfe0d4; background: #fff; color: var(--deep); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
.chip.on { background: var(--g); border-color: var(--g); color: #fff; }
.rpts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.rpt { text-align: left; display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1.5px solid #dbe8df; border-radius: var(--r); padding: 12px; cursor: pointer; color: var(--ink); }
.rpt:hover { border-color: var(--g); }
.rpt .ic { font-size: 26px; line-height: 1; }
.rpt b { display: block; font-size: 16px; color: var(--deep); }
.rpt small { color: var(--muted); font-size: 13px; }
.grp { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .04em; margin: 14px 2px 8px; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 800; cursor: pointer; background: var(--g); color: #fff; width: 100%; min-height: 48px; }
.btn.sec { background: var(--gl); color: var(--deep); }
.hint { color: var(--muted); font-size: 14px; }
.err { color: var(--red); font-weight: 700; }
.login { max-width: 400px; margin: 8vh auto 0; }
.pin { letter-spacing: .5em; text-align: center; font-size: 22px; }
#toast { position: fixed; left: 50%; bottom: calc(20px + var(--safe-b)); transform: translateX(-50%); background: var(--deep); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20000; max-width: 92vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; } #toast.err { background: var(--red); }
#busy { position: fixed; inset: 0; background: rgba(10,30,18,.35); z-index: 15000; display: none; align-items: center; justify-content: center; }
#busy div { background: #fff; padding: 16px 20px; border-radius: 14px; font-weight: 700; }
</style>
<style>
/* ---------- ใบพิมพ์ (PrintKit) ---------- */
#pk-ov { position: fixed; inset: 0; z-index: 9999; background: #dfe6e2; display: flex; flex-direction: column; }
.pk-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: #14432b; color: #fff; padding-top: max(10px, env(safe-area-inset-top)); }
.pk-bar b { font-size: 16px; flex: 1 1 auto; }
#pk-ov .pk-bar select { font: 600 15px Sarabun, sans-serif; padding: 8px 10px; border-radius: 10px; border: 0; max-width: 100%; min-height: 0; color: #1b2b22; -webkit-text-fill-color: #1b2b22; background: #fff; flex: 1 1 180px; }
#pk-ov .pk-bar button { min-height: 0; }
.pk-bar button { font: 700 15px Sarabun, sans-serif; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; }
.pk-go { background: #f5c542; color: #3b2c00; }
.pk-xl { background: #e8f5ee; color: #145f2f; }
.pk-pb { height: 0; break-after: page; page-break-after: always; }
.pk-sheet .pk-pb { border-top: 2px dashed #9bbfa8; margin: 22px -12mm; }
.pk-doc.tall td { padding-top: 7px; padding-bottom: 7px; }
.pk-x { background: rgba(255,255,255,.15); color: #fff; }
.pk-scroll { flex: 1; overflow: auto; padding: 14px 12px 30px; -webkit-overflow-scrolling: touch; }
.pk-sheet { background: #fff; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 12mm; box-shadow: 0 4px 22px rgba(0,0,0,.18); }
.pk-msg { text-align: center; color: #4b5b52; font: 600 13px Sarabun, sans-serif; margin: 0 0 10px; }
#pk-print { display: none; }
.pk-doc { font-family: Sarabun, 'TH Sarabun New', sans-serif; color: #000; font-size: 12.5px; line-height: 1.35; }
.pk-doc .pk-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 8px; }
.pk-doc h1 { font-size: 20px; margin: 0; font-weight: 800; }
.pk-doc .pk-sub { font-size: 12px; color: #333; }
.pk-doc .pk-docno { text-align: right; font-size: 12px; }
.pk-doc .pk-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; margin-bottom: 8px; }
.pk-doc .pk-meta div { display: flex; gap: 6px; }
.pk-doc .pk-meta span { color: #444; min-width: 92px; }
.pk-doc table { width: 100%; border-collapse: collapse; }
.pk-doc th, .pk-doc td { border: 1px solid #000; padding: 3px 5px; vertical-align: top; }
.pk-doc th { background: #eee; font-weight: 700; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc td.n, .pk-doc th.n { text-align: center; white-space: nowrap; }
.pk-doc td.d { text-align: center; white-space: nowrap; }
.pk-doc td.c { text-align: center; white-space: nowrap; }
.pk-doc td.code { white-space: nowrap; }
.pk-doc td.blank { min-width: 60px; }
.pk-doc tr.hl td { background: #f2f2f2; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc tfoot td { font-weight: 800; background: #f7f7f7; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc thead { display: table-header-group; }
.pk-doc tr { break-inside: avoid; page-break-inside: avoid; }
.pk-doc .pk-sum { margin: 8px 0 0; font-size: 12.5px; }
.pk-doc .pk-note { margin-top: 8px; border: 1px solid #000; padding: 4px 6px; min-height: 42px; }
.pk-doc .pk-sign { display: grid; gap: 14px; margin-top: 26px; break-inside: avoid; page-break-inside: avoid; }
.pk-doc .pk-sign div { text-align: center; font-size: 12.5px; }
.pk-doc .pk-sign .ln { border-bottom: 1px dotted #000; height: 26px; margin: 0 6px 4px; }
.pk-doc .pk-foot { margin-top: 14px; font-size: 10.5px; color: #555; display: flex; justify-content: space-between; }
.pk-doc .pk-empty { text-align: center; padding: 18px; color: #555; }

.pk-doc .pk-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 10px}
.pk-doc .pk-tiles div{border:1px solid var(--pgm);border-radius:6px;padding:4px 8px;text-align:center}
.pk-doc .pk-tiles span{display:block;font-size:10px;color:#4b6b55}
.pk-doc .pk-tiles b{font-size:12.5px;color:var(--pg)}
.pk-doc .pk-tiles .bad{background:#fdecea;border-color:#f0b9b2;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pk-doc .pk-tiles .bad b{color:#a93226}
.pk-doc .pk-tiles .warn{background:#fff7e0;border-color:#f3d98a;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pk-doc .pk-tiles .warn b{color:#8a6200}
.pk-doc h2.pk-sec{font-size:14px;margin:12px 0 5px;color:var(--pg);border-left:4px solid var(--pg2);padding-left:7px}
.pk-doc h2.pk-sec.bad{color:#a93226;border-color:#c0392b;break-before:auto}
.pk-doc tr.grp td{background:#eef6f1;font-weight:800;color:var(--pg);-webkit-print-color-adjust:exact;print-color-adjust:exact}

.pk-doc tr.tot td{font-weight:800;background:var(--pgl);color:var(--pg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pk-doc h2.pk-sec.bad{break-before:auto}
.pk-doc .pk-sub2{display:none;font-size:11px;color:#4b6b55;margin:14px 0 4px;border-top:1px dashed var(--pgm);padding-top:8px}
@media print{.pk-doc .pk-sub2{display:block;break-before:page;page-break-before:always;border:0;padding:0;margin-top:0}}
@media screen{.pk-doc .pk-sub2{display:block}}

/* ธีมเขียว */
.pk-doc { --pg: #145f2f; --pg2: #1a7a3c; --pgl: #e8f5ee; --pgm: #b8dfc8; }
.pk-doc .pk-head { border-bottom: 3px solid var(--pg2); }
.pk-doc .pk-kick { display: block; letter-spacing: .16em; font-size: 9.5px; color: var(--pg2); font-weight: 700; }
.pk-doc h1 { color: var(--pg); }
.pk-doc .pk-sub { color: var(--pg2); font-weight: 600; }
.pk-doc .pk-meta { gap: 6px; grid-template-columns: repeat(3, 1fr); }
.pk-doc .pk-meta div { display: block; background: var(--pgl); border-left: 3px solid var(--pg2); border-radius: 4px; padding: 3px 8px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc .pk-meta span { display: block; font-size: 10px; min-width: 0; color: #4b6b55; }
.pk-doc th { background: var(--pg2); color: #fff; border-color: var(--pg2); }
.pk-doc td { border-color: var(--pgm); }
.pk-doc tbody tr:nth-child(even) td { background: #f6fbf8; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc tr.hl td, .pk-doc tbody tr.hl:nth-child(even) td { background: #fdecea; }
.pk-doc tfoot td { background: var(--pgl); color: var(--pg); border-color: var(--pgm); }
.pk-doc .pk-note { border: 1px solid var(--pgm); border-left: 3px solid var(--pg2); border-radius: 4px; }
.pk-doc .pk-note b { color: var(--pg); }
.pk-doc .pk-sign b { color: var(--pg); }
.pk-doc .pk-foot { border-top: 1px solid var(--pgm); padding-top: 4px; }
@media print {
  @page { size: A4; margin: 10mm; }
  html, body { background: #fff !important; }
  body.pk-printing > *:not(#pk-print) { display: none !important; }
  body.pk-printing #pk-print { display: block !important; }
}
</style>
<script>
/* PrintKit — หน้าตัวอย่างใบพิมพ์ A4 + สั่งพิมพ์ (ใช้ร่วมกันทั้ง 3 แอป) */
window.PrintKit = (function () {
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
  var pad = function (n) { return (n < 10 ? '0' : '') + n }
  // ช่องที่เป็นวันที่/เวลา → จัดกึ่งกลาง (เช่น 23 พ.ย. 2026 · 23/11/2026 · 2026-11-23 · 20:15)
  var DATE_RE = /^(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}(\/\d{2,4})?|\d{1,2} [\u0E00-\u0E7F.]{2,6} \d{2,4})( \d{1,2}:\d{2}(:\d{2})?)?$|^\d{1,2}:\d{2}$/
  var isDate = function (v) { return typeof v === 'string' && DATE_RE.test(v.trim()) }
  function stamp() { var d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) }
  // doc = { title, sub, docNoLabel, meta:[[label,value]], cols:[{h, cls, w}], rows:[{cells:[], hl}], foot:[cells]|null, summary:html, noteBox:label|null, sign:[labels], empty }
  /* ---------- ส่งออก Excel แบบฟอร์ม (หน้าตาเดียวกับใบพิมพ์ · ธีมเขียว) ----------
     doc เดียว = 1 ชีต · หลายใบ (array) = หลายชีตในไฟล์เดียว · หัวตารางพิมพ์ซ้ำทุกหน้า · A4 พอดีความกว้าง */
  var XL = (function () {
    var CRC = (function () { var t = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0 } return t })()
    function crc(b) { var c = 0xffffffff; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0 }
    function zip(files) { // เก็บแบบไม่บีบอัด (Excel เปิดได้ปกติ)
      var enc = new TextEncoder(), parts = [], cen = [], off = 0
      var u16 = function (v) { return [v & 255, (v >>> 8) & 255] }, u32 = function (v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255] }
      files.forEach(function (f) {
        var name = enc.encode(f.name), data = enc.encode(f.data), c = crc(data)
        var lh = [].concat([0x50, 0x4b, 3, 4], u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(c), u32(data.length), u32(data.length), u16(name.length), u16(0))
        parts.push(new Uint8Array(lh), name, data)
        cen.push(new Uint8Array([].concat([0x50, 0x4b, 1, 2], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(c), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off))), name)
        off += lh.length + name.length + data.length
      })
      var cs = cen.reduce(function (a, x) { return a + x.length }, 0)
      var n = files.length
      return new Blob(parts.concat(cen, [new Uint8Array([].concat([0x50, 0x4b, 5, 6], u16(0), u16(0), u16(n), u16(n), u32(cs), u32(off), u16(0)))]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })
    }
    var xe = function (v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '') }
    var colL = function (i) { var s = ''; i++; while (i > 0) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26) } return s }
    var plain = function (h) { return String(h == null ? '' : h).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|li)>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\n{3,}/g, '\n\n').trim() }
    // ---------- สไตล์ (สร้างตามที่ใช้จริง) ----------
    function Styles() {
      var fonts = ['<font><sz val="10"/><name val="Tahoma"/></font>'], fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'], borders = ['<border/>'], xfs = ['<xf fontId="0" fillId="0" borderId="0"/>'], key = {}
      var idx = function (arr, x) { var i = arr.indexOf(x); if (i < 0) { arr.push(x); i = arr.length - 1 } return i }
      this.get = function (o) {
        var k = JSON.stringify(o); if (key.hasOwnProperty(k)) return key[k]
        var f = idx(fonts, '<font>' + (o.b ? '<b/>' : '') + (o.i ? '<i/>' : '') + '<sz val="' + (o.sz || 10) + '"/><color rgb="FF' + (o.c || '000000') + '"/><name val="Tahoma"/></font>')
        var fl = o.bg ? idx(fills, '<fill><patternFill patternType="solid"><fgColor rgb="FF' + o.bg + '"/><bgColor indexed="64"/></patternFill></fill>') : 0
        var bd = 0
        if (o.bd || o.bl || o.bb || o.bt) {
          var side = function (n, on, st, col) { return on ? '<' + n + ' style="' + st + '"><color rgb="FF' + col + '"/></' + n + '>' : '<' + n + '/>' }
          var bc = o.bc || 'B8DFC8'
          bd = idx(borders, '<border>' + side('left', o.bd || o.bl, o.bl ? 'thick' : 'thin', o.bl ? '1A7A3C' : bc) + side('right', o.bd, 'thin', bc) + side('top', o.bd || o.bt, o.bt ? 'medium' : 'thin', o.bt ? '1A7A3C' : bc) + side('bottom', o.bd || o.bb, o.bb ? (o.bbs || 'medium') : 'thin', o.bb ? (o.bbc || '1A7A3C') : bc) + '<diagonal/></border>')
        }
        var al = '<alignment' + (o.h ? ' horizontal="' + o.h + '"' : '') + ' vertical="' + (o.v || 'center') + '"' + (o.w ? ' wrapText="1"' : '') + '/>'
        xfs.push('<xf numFmtId="' + (o.num ? 164 : 0) + '" fontId="' + f + '" fillId="' + fl + '" borderId="' + bd + '" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"' + (o.num ? ' applyNumberFormat="1"' : '') + '>' + al + '</xf>')
        return (key[k] = xfs.length - 1)
      }
      this.xml = function () {
        return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.###;-#,##0.###;0"/></numFmts>' +
          '<fonts count="' + fonts.length + '">' + fonts.join('') + '</fonts><fills count="' + fills.length + '">' + fills.join('') + '</fills><borders count="' + borders.length + '">' + borders.join('') + '</borders>' +
          '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="' + xfs.length + '">' + xfs.join('') + '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'
      }
    }
    var G = '145F2F', G2 = '1A7A3C', GL = 'E8F5EE', GM = 'B8DFC8'
    // ---------- 1 doc → 1 ชีต ----------
    function sheetOf(doc, ST) {
      var cols = doc.cols || [], n = Math.max(cols.length, 3), rows = [], merges = [], heights = {}, R = 0, titleRow = 0
      var total = 100, fixed = 0, free = 0
      cols.forEach(function (c) { var p = parseFloat(c.w); if (p) fixed += p; else free++ })
      var widths = cols.map(function (c) { var p = parseFloat(c.w); var w = p ? p : Math.max(8, (100 - fixed) / Math.max(free, 1)); return Math.max(5, Math.round(w * total / 100 * 1.05)) })
      while (widths.length < n) widths.push(14)
      var put = function (r, c, v, s, kind) { (rows[r] || (rows[r] = []))[c] = { v: v, s: s, k: kind } }
      var span = function (r, c1, c2, v, s, rh) { // merged cell (ใส่สไตล์ทุกช่องให้เส้นขอบครบ)
        for (var c = c1; c <= c2; c++) put(r, c, c === c1 ? v : '', s)
        if (rh) for (var k = 1; k < rh; k++) for (var c3 = c1; c3 <= c2; c3++) put(r + k, c3, '', s)
        if (c2 > c1 || rh > 1) merges.push(colL(c1) + (r + 1) + ':' + colL(c2) + (r + (rh || 1)))
      }
      var groups = function (k) { // แบ่งคอลัมน์เป็น k กลุ่มให้ความกว้างใกล้กัน
        var tot = widths.slice(0, n).reduce(function (a, w) { return a + w }, 0), out = [], a = 0, acc = 0
        for (var i = 0; i < n && out.length < k - 1; i++) { acc += widths[i]; if (acc >= tot * (out.length + 1) / k && n - i - 1 >= k - out.length - 1) { out.push([a, i]); a = i + 1 } }
        out.push([a, n - 1])
        while (out.length < k) out.push([n - 1, n - 1])
        return out
      }
      // หัวกระดาษ
      if (doc.kicker) span(R, 0, n - 3 >= 0 ? Math.max(0, n - 3) : 0, doc.kicker, ST.get({ sz: 8, b: 1, c: G2 }))
      span(R, Math.max(1, n - 2), n - 1, (doc.docNoLabel || 'เลขที่เอกสาร') + ' ...................', ST.get({ sz: 9, h: 'right' }))

  // 🔧 ตรวจการปรับสต๊อก

    const check = (day) => {
      const to = addD(day, 14), cnt = {}

      const adj = {}, unk = new Set()
      ;(sm.rows || []).filter((x) => SAP5.indexOf(x.type) < 0 && x.date >= day && x.date <= to).forEach((x) => {
        const v = packsOf((cnt[x.code] && cnt[x.code].pack) || pk(x.code), x.uom, (+x.qin || 0) - (+x.qout || 0))
        const a = adj[x.code] || (adj[x.code] = { q: 0, docs: [] })
        if (v == null) unk.add(x.code); else a.q = r3(a.q + v)
        if (a.docs.indexOf(x.doc) < 0) a.docs.push(x.doc)
      })

          cols: [{ h: 'ลำดับ', cls: 'c', w: '5%' }, { h: 'รหัสสินค้า', cls: 'code', w: '11%' }, { h: 'ชื่อสินค้า' }, { h: 'แพคไซส์', w: '10%' }, { h: 'ในระบบ', cls: 'n', w: '7%' }, { h: 'นับจริง', cls: 'n', w: '7%' }, { h: 'ควรปรับ', cls: 'n', w: '7%' }, { h: 'คลังปรับ', cls: 'n', w: '7%' }, { h: 'เอกสาร', w: '11%' }, { h: 'ผลตรวจ', w: '15%' }],
          rows: L.map((x, i) => ({ hl: x.st !== 'ok', cells: [i + 1, x.c, x.name, x.pack, x.sys == null ? '-' : fmt(x.sys), x.cnt == null ? '-' : fmt(x.cnt), sg(x.need) || '0', sg(x.got) || '0', x.docs.join(', '), x.txt] })),

  async function rTransfer() {

    const days = Array.from(new Set(rec.map((e) => e.date).concat(tr.map((x) => x.date)).filter((k) => k >= ST.from && k <= ST.to))).sort()
    const recon = (day) => {
      let use = tr.filter((x) => x.date === day)
      if (!use.length) use = tr.filter((x) => x.date === addD(day, -1)) // โอนตอนเที่ยงคืน ลงวันที่ก่อนหน้า

        '<label class="f">สาขา</label><select id="l-br"><option value="">— เลือกสาขา —</option>' + CFG.BRANCHES.map((b) => '<option value="' + esc(b.id) + '">' + esc(b.name) + '</option>').join('') + '</select>' +
        '<label class="f">ชื่อผู้ใช้</label><input id="l-user" type="text" placeholder="เช่น แผน" autocomplete="name">' +
        '<label class="f">รหัสยืนยันสาขา (4 หลัก)</label><input id="l-pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">' +
        '<p id="l-err" class="err"></p><button type="button" class="btn" data-a="login">เข้าสู่ระบบ</button></div></div>'
      const pin = $('#l-pin'); pin.addEventListener('input', () => { if (pin.value.length === 4) login() })
      return
    }
    const g = {}; REPORTS.forEach((r) => { (g[r.grp] || (g[r.grp] = [])).push(r) })
    app.innerHTML = '<div class="top"><a class="home" href="../homepage/" title="หน้าโฮม">🏠</a><div class="t"><b>📑 ศูนย์รายงาน · ' + esc(BR().name) + '</b><small>' + esc(SESSION.user) + ' · อ่านอย่างเดียว ไม่แก้ข้อมูล</small></div><button type="button" data-a="logout">ออก</button></div>' +
      '<div class="wrap"><div class="card"><h2>📅 ช่วงวันที่</h2><div class="row2"><div><label class="f">ตั้งแต่</label><input type="date" id="f-from" value="' + ST.from + '"></div><div><label class="f">ถึง</label><input type="date" id="f-to" value="' + ST.to + '"></div></div>' +
      '<div class="chips">' + PRESETS.map((p, i) => { const v = p[1](); return '<button type="button" class="chip' + (v[0] === ST.from && v[1] === ST.to ? ' on' : '') + '" data-p="' + i + '">' + p[0] + '</button>' }).join('') + '</div>' +
      '<p class="hint" style="margin:10px 0 0">ผลนับใช้ <b>วันที่นับจริง</b> · ข้อมูลเก่ากว่า 120 วันดึงจากไฟล์ข้อมูลเก่าให้อัตโนมัติ (อาจช้าขึ้นเล็กน้อย)</p></div>' +
      Object.keys(g).map((k) => '<div class="grp">' + esc(k) + '</div><div class="rpts">' + g[k].map((r) => '<button type="button" class="rpt" data-r="' + r.id + '"><span class="ic">' + r.ic + '</span><span><b>' + esc(r.t) + '</b><small>' + esc(r.d) + '</small></span></button>').join('') + '</div>').join('') +
      '</div>'
  }
  function login() {
    const id = $('#l-br').value, user = $('#l-user').value.trim(), pin = $('#l-pin').value
    const b = CFG.BRANCHES.find((x) => x.id === id), err = $('#l-err')
    if (!b) { err.textContent = 'เลือกสาขาก่อน'; return }
    if (!user) { err.textContent = 'ใส่ชื่อผู้ใช้'; return }
    if (String(b.pin) !== pin) { err.textContent = 'รหัสยืนยันไม่ถูกต้อง'; $('#l-pin').value = ''; return }
    SESSION = { branchId: id, user: user, date: today() }; ls.set(K.session, SESSION); PROD = null; render()
  }
  async function runReport(id) {
    const r = REPORTS.find((x) => x.id === id); if (!r) return
    if (ST.from > ST.to) { toast('วันที่เริ่มต้องไม่เกินวันที่สิ้นสุด', 'err'); return }
    busy(true)
    try { const cfg = await r.run(); busy(false); window.PrintKit.open(cfg) } catch (e) { busy(false); toast(navigator.onLine === false ? 'ไม่มีอินเทอร์เน็ต' : e.message, 'err', 4000) }
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-a]'), p = e.target.closest('[data-p]'), r = e.target.closest('[data-r]')
    if (a && a.dataset.a === 'login') login()
    else if (a && a.dataset.a === 'logout') { SESSION = null; ls.set(K.session, null); render() }
    else if (p) { const v = PRESETS[Number(p.dataset.p)][1](); ST.from = v[0]; ST.to = v[1]; ls.set(K.state, ST); render() }
    else if (r) runReport(r.dataset.r)
  })
  document.addEventListener('change', (e) => {
    if (e.target.id === 'f-from' || e.target.id === 'f-to') { ST.from = $('#f-from').value || ST.from; ST.to = $('#f-to').value || ST.to; ls.set(K.state, ST); render() }
  })
  if (window.__RP_TEST) window.__RP = { REPORTS: REPORTS, ST: ST, runReport: runReport, packsOf: packsOf }
  render()
})()
</script>
</body>
</html>
